server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;
    add_header Permissions-Policy "unload=(self)" always;
    # Keep the externally mapped port (for example 5174) in redirects.
    absolute_redirect off;

    # API must win over the later static-file regex: uploaded /api/assets/*.png
    # is served by the backend object-store proxy, not by the SPA document root.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = / {
        return 302 /admin/;
    }

    # R5：静态资源缺失直接 404，不回退到 SPA index.html
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|mjs|json|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}
