name: ai-campus

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_campus_platform}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_allowed_packet=128M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./web/backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-app-extension.sql:/docker-entrypoint-initdb.d/02-app-extension.sql:ro
      - ./web/backend/src/main/resources/db/migrate_v7_system_config.sql:/docker-entrypoint-initdb.d/03-system-config.sql:ro
      - ./web/backend/src/main/resources/db/reset_and_testdata.sql:/docker-entrypoint-initdb.d/99-testdata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # REDIS_PASSWORD is shared by the Redis server, backend client, and health check.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (e.g. openssl rand -hex 24)}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-ai_campus_platform}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (must match redis service)}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # Signing secrets are required; Compose does not fall back to public values.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (long random string, e.g. openssl rand -hex 32)}
      SIGNIN_SECRET: ${SIGNIN_SECRET:?SIGNIN_SECRET must be set in .env (random string)}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  student:
    build:
      context: .
      dockerfile: docker/Dockerfile.student
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${STUDENT_PORT:-5173}:80"

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5174}:80"

volumes:
  mysql_data:
  redis_data:
